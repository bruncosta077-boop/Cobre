      <button id="prev" aria-label="Anterior" title="Anterior"><svg><use href="#i-prev"/></svg></button>
      <button id="play" aria-label="Tocar"><svg><use href="#i-play"/></svg></button>
      <button id="next" aria-label="Próxima" title="Próxima"><svg><use href="#i-next"/></svg></button>
      <button id="rep" aria-label="Repetir lista" title="Repetir lista"><svg><use href="#i-rep"/></svg></button>
    </div>
    <div class="seekrow"><span id="cur">0:00</span><div class="seekw"><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Posição da música"></div><span id="tot">0:00</span></div>
  </div>
  <div class="bar-tools">
    <button id="lyrb" class="bt" aria-label="Letra" title="Letra" aria-pressed="false"><svg><use href="#i-lyr"/></svg></button>
    <button id="qb" class="bt" aria-label="Fila" title="Fila" aria-pressed="false"><svg><use href="#i-queue"/></svg></button>
    <button id="fxb" class="bt" data-pop aria-label="Som e equalizador" title="Som e equalizador"><svg><use href="#i-fx"/></svg></button>
    <button id="outb" class="bt" data-pop aria-label="Saída de áudio" title="Saída de áudio"><svg><use href="#i-out"/></svg></button>
    <div class="vol"><svg><use href="#i-vol"/></svg><input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume"></div>
    <span class="bar-sep" aria-hidden="true"></span>
    <button id="fsb" class="bt" aria-label="Tela cheia" title="Tela cheia (F11)"><svg><use href="#i-fs"/></svg></button>
    <button id="cinb" class="bt" aria-label="Modo cinema" title="Modo cinema"><svg><use href="#i-cin"/></svg></button>
    <select id="out" hidden></select>
  </div>
</footer>
<button id="cinx" aria-label="Sair do modo cinema" title="Sair (Esc)"><svg><use href="#i-x"/></svg></button>
<div id="pop" hidden role="dialog"></div>
<div id="ctx" hidden role="menu"></div>
<div id="cfm" hidden><div class="cbox" id="cbox" role="dialog" aria-modal="true"></div></div>
<div id="an" hidden><div class="abox"><div class="ahd"><h3 id="ant"></h3><button id="anx" aria-label="Fechar" title="Fechar"><svg><use href="#i-x"/></svg></button></div><canvas id="anc" width="980" height="440"></canvas><div id="anr"></div></div></div>
<div id="toast" hidden role="status" aria-live="polite"></div>
<div id="big" hidden></div>
<script src="playback-duration.js"></script>
<script src="renderer.js"></script>
<script src="features.js"></script>
<script src="layout.js"></script>
</body>
</html>
