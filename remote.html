<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cobre</title>
<meta name="color-scheme" content="dark light">
<style>
/* Cobre remoto: mesma identidade do app desktop. Servido como arquivo único pela rede local,
   então os tokens ficam aqui e as fontes caem nas do sistema. Segue o tema do aparelho. */
:root{--bg:#121110;--pn:#181614;--raised:#1f1c19;--ln:#2a2623;--tr:#3a3430;--tx:#ece6df;--mu:#8d847b;--cu:#c9773f;--cu2:#e6a06a;--ink:#c9773f;--on:#121110;--ok:#6fb5a5;
  --sheen:linear-gradient(140deg,#ffffff2e,#ffffff00 28%);--empty:radial-gradient(circle at 34% 28%,#2c2622,#1a1715 62%,#141210);--ease:cubic-bezier(.22,.8,.24,1);color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f4efe8;--pn:#ebe4da;--raised:#fbf8f3;--ln:#d9cfc2;--tr:#cfc4b5;--tx:#241f1a;--mu:#6f655a;--ink:#964f1d;--ok:#276d5f;
  --sheen:linear-gradient(140deg,#ffffff66,#ffffff00 28%);--empty:radial-gradient(circle at 34% 28%,#fffaf3,#e4dacd 62%,#d9cdbe);color-scheme:light}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.45 'Bricolage Grotesque','Segoe UI Variable','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:180px}
header{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--ln)}
h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
h1::before{content:"";width:16px;height:16px;border-radius:50%;border:3px solid var(--cu);border-right-color:transparent}
input[type=search]{flex:1;min-width:120px;background:var(--pn);border:1px solid var(--ln);border-radius:99px;padding:10px 16px;color:var(--tx);font:inherit;outline:none;transition:border-color .24s var(--ease),box-shadow .24s var(--ease)}
input[type=search]:focus{border-color:var(--cu2);box-shadow:0 0 0 3px color-mix(in srgb,var(--cu) 18%,transparent)}
input[type=search]::placeholder{color:var(--mu)}
button{background:none;border:0;color:var(--tx);font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s var(--ease),filter .24s var(--ease),background-color .24s var(--ease)}
button:active{transform:scale(.96)}
:focus-visible{outline:2px solid var(--cu2);outline-offset:2px}
#bk{font-size:26px;line-height:1;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--mu)}
.chip{border:1px solid var(--tr);color:var(--tx);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:500;white-space:nowrap}
.chip.big{background:var(--sheen),var(--cu);color:var(--on);border:0;padding:12px 18px;font-weight:600}
#g{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:22px 16px;padding:18px 16px;text-align:center}
.c{cursor:pointer}
.c img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;background:var(--empty);display:block;box-shadow:0 0 0 1px var(--ln),0 10px 24px #0005}
.c b,.c i{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:normal}
.c b{margin-top:10px;font-weight:600;font-size:14px}
.c i{color:var(--mu);font-size:12px}
.ah{display:flex;gap:18px;padding:20px 16px 18px;align-items:center}
.ah img{width:124px;height:124px;border-radius:50%;object-fit:cover;background:var(--empty);flex:none;box-shadow:0 0 0 1px var(--ln),0 16px 36px #0006}
.ah b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.ah i{display:block;color:var(--mu);font-style:normal;margin:4px 0 12px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.t{display:flex;gap:14px;padding:13px 16px;border-bottom:1px solid var(--ln);cursor:pointer;align-items:baseline}
.t span:first-child{min-width:18px;color:var(--mu);font:500 12px ui-monospace,'Cascadia Mono',Consolas,monospace}
.t.on,.t.on span:first-child{color:var(--ok);font-weight:600}
.t span:last-child{margin-left:auto;color:var(--mu);font:500 12px ui-monospace,'Cascadia Mono',Consolas,monospace}
#bar{position:fixed;left:10px;right:10px;bottom:10px;background:var(--raised);border:1px solid var(--ln);border-radius:22px;padding:12px 14px;display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;box-shadow:0 18px 50px #0007}
#bar img{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--empty);box-shadow:0 0 0 1px var(--ln)}
#bar .m{min-width:0}
#bar b,#bar i{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:normal}
#bar b{font-weight:700}
#bar i{color:var(--mu);font-size:12px}
#lb{color:var(--ok);font:500 10.5px ui-monospace,'Cascadia Mono',Consolas,monospace;letter-spacing:.08em;text-transform:uppercase}
input[type=range]{width:100%;accent-color:var(--cu);margin:6px 0 0}
.k{display:flex;align-items:center;gap:2px}
.k button{font-size:20px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;padding:0;color:var(--tx)}
#pl{background:var(--sheen),var(--cu);color:var(--on);width:48px;height:48px;font-size:18px}
#sh{position:fixed;inset:0;z-index:5;background:rgba(8,7,6,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end}
#sh div{width:100%;background:var(--raised);border-top:1px solid var(--ln);border-radius:22px 22px 0 0;padding:22px 18px 30px;display:flex;flex-direction:column;gap:12px}
#sh b{font-size:18px;font-weight:800;letter-spacing:-.01em}
#sh label{color:var(--mu);font-size:13px;display:flex;align-items:center;gap:8px}
</style></head>
<body>
<header><button id="bk" hidden aria-label="Voltar">‹</button><h1>Cobre</h1><input id="q" type="search" placeholder="Buscar"><button id="md" class="chip"></button></header>
<div id="g"></div><div id="tl" hidden></div>
<div id="sh" hidden><div><b>Onde você quer ouvir?</b><button class="chip big" data-t="pc">Tocar no PC (pré-amp)</button><button class="chip big" data-t="phone">Tocar neste aparelho</button><label><input type="checkbox" id="rem"> Lembrar a escolha</label></div></div>
<div id="bar"><img id="ci" alt=""><div class="m"><span id="lb"></span><b id="ti">Nada tocando</b><i id="ar"></i><input id="sk" type="range" min="0" max="1000" value="0"><input id="vl" type="range" min="0" max="100" value="80" hidden aria-label="Volume do PC"></div><div class="k"><button id="pv" aria-label="Anterior">⏮</button><button id="pl" aria-label="Tocar">▶</button><button id="nx" aria-label="Próxima">⏭</button></div></div>
<audio id="a"></audio>
<script>
const $ = (s) => document.querySelector(s), a = $('#a');
const TL = { ask: 'Destino: perguntar', pc: 'Destino: PC', phone: 'Destino: celular' };
let T = [], AL = [], Q = [], qi = -1, open = null, pc = false, np = {}, pend = null, tgt = localStorage.tgt || 'ask';
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mmss = (s) => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
const cmd = (c, o = {}) => fetch('/api/cmd?' + new URLSearchParams({ c, ...o })).catch(() => {});
$('#md').textContent = TL[tgt];
$('#md').onclick = () => { tgt = tgt === 'ask' ? 'pc' : tgt === 'pc' ? 'phone' : 'ask'; localStorage.tgt = tgt; $('#md').textContent = TL[tgt]; };
fetch('/api/lib').then((r) => r.json()).then((d) => {
  T = d; const m = new Map();
  for (const t of d) { const k = t[2] + '|' + t[3]; if (!m.has(k)) m.set(k, { artist: t[2], album: t[3] || 'Sem álbum', year: t[4], tr: [] }); m.get(k).tr.push(t); }
  AL = [...m.values()].sort((x, y) => x.artist.localeCompare(y.artist) || (x.year || 9999) - (y.year || 9999));
  AL.forEach((x) => x.tr.sort((p, q) => p[7] - q[7]));
  grid();
});
function grid() {
  open = null; $('#bk').hidden = true; $('#tl').hidden = true; $('#g').hidden = false;
  const s = $('#q').value.toLowerCase();
  $('#g').innerHTML = AL.map((x, i) => [x, i]).filter(([x]) => (x.artist + ' ' + x.album).toLowerCase().includes(s)).map(([x, i]) => `<div class="c" data-i="${i}"><img loading="lazy" src="/cover/${x.tr[0][0]}"><b>${esc(x.album)}</b><i>${esc(x.artist)}${x.year ? ' · ' + x.year : ''}</i></div>`).join('');
}
function album(i) {
  open = AL[i]; $('#bk').hidden = false; $('#g').hidden = true; $('#tl').hidden = false;
  const cur = pc ? np.id : (Q[qi] && Q[qi][0]);
  $('#tl').innerHTML = `<div class="ah"><img src="/cover/${open.tr[0][0]}" alt=""><div><b>${esc(open.album)}</b><i>${esc(open.artist)}${open.year ? ' · ' + open.year : ''}</i><div class="acts"><button class="chip big" data-all="pc">Tocar no PC</button><button class="chip big" data-all="phone">Tocar no celular</button></div></div></div>` +
    open.tr.map((t, j) => `<div class="t${cur === t[0] ? ' on' : ''}" data-j="${j}"><span>${t[7] || j + 1}</span><span>${esc(t[1])}</span><span>${t[6] ? mmss(t[6]) : ''}</span></div>`).join('');
  window.scrollTo(0, 0);
}
function choose(list, j) { if (tgt !== 'ask') return play(list, j, tgt); pend = { list, j }; $('#sh').hidden = false; }
$('#sh').onclick = (e) => {
  const b = e.target.closest('[data-t]');
  if (!b) { if (e.target.id === 'sh') $('#sh').hidden = true; return; }
  $('#sh').hidden = true;
  if ($('#rem').checked) { tgt = b.dataset.t; localStorage.tgt = tgt; $('#md').textContent = TL[tgt]; }
  play(pend.list, pend.j, b.dataset.t);
};
function play(list, j, target) {
  pc = target === 'pc'; $('#vl').hidden = !pc; $('#lb').textContent = pc ? 'Tocando no PC' : 'Tocando neste aparelho';
  if (pc) { a.pause(); cmd('play', { ids: list.map((t) => t[0]).join(','), i: j }); setTimeout(poll, 600); }
  else {
    Q = list; qi = j; const t = Q[qi];
    a.src = '/stream/' + t[0]; a.play(); show(t[1], t[2] + (t[3] ? ' · ' + t[3] : ''), t[0]);
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: t[1], artist: t[2], album: t[3], artwork: [{ src: '/cover/' + t[0], sizes: '320x320', type: 'image/jpeg' }] });
      navigator.mediaSession.setActionHandler('nexttrack', next); navigator.mediaSession.setActionHandler('previoustrack', prev);
    }
  }
  if (open) album(AL.indexOf(open));
}
function show(title, sub, id) { $('#ti').textContent = title; $('#ar').textContent = sub; if (id >= 0) $('#ci').src = '/cover/' + id; }
const next = () => { if (pc) return cmd('next'); if (qi + 1 < Q.length) play(Q, qi + 1, 'phone'); };
const prev = () => { if (pc) return cmd('prev'); if (a.currentTime > 3 || qi <= 0) a.currentTime = 0; else play(Q, qi - 1, 'phone'); };
$('#g').onclick = (e) => { const c = e.target.closest('.c'); if (c) album(+c.dataset.i); };
$('#tl').onclick = (e) => {
  const all = e.target.closest('[data-all]');
  if (all && open) return play(open.tr, 0, all.dataset.all);
  const r = e.target.closest('.t');
  if (r && open) choose(open.tr, +r.dataset.j);
};
$('#bk').onclick = grid; $('#q').oninput = grid;
$('#pl').onclick = () => { if (pc) cmd('toggle'); else a.paused ? a.play() : a.pause(); };
$('#nx').onclick = next; $('#pv').onclick = prev;
a.onplay = () => { if (!pc) $('#pl').textContent = '⏸'; }; a.onpause = () => { if (!pc) $('#pl').textContent = '▶'; }; a.onended = next;
a.ontimeupdate = () => { if (!pc && a.duration) $('#sk').value = a.currentTime / a.duration * 1000; };
$('#sk').onchange = (e) => { if (pc) cmd('seek', { v: e.target.value / 10 }); else if (a.duration) a.currentTime = e.target.value / 1000 * a.duration; };
$('#vl').onchange = (e) => cmd('vol', { v: e.target.value });
async function poll() {
  if (!pc) return;
  try {
    np = await (await fetch('/api/np')).json();
    show(np.title || 'Nada tocando no PC', [np.artist, np.album].filter(Boolean).join(' · '), np.id);
    $('#pl').textContent = np.playing ? '⏸' : '▶';
    if (np.dur && document.activeElement !== $('#sk')) $('#sk').value = np.pos / np.dur * 1000;
    if (document.activeElement !== $('#vl')) $('#vl').value = np.vol;
  } catch {}
}
setInterval(poll, 1200);
</script></body></html>
