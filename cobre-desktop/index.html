<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cobre</title>
<style>
:root{--bg:#121110;--pn:#181614;--ln:#2a2623;--tx:#ece6df;--mu:#8d847b;--cu:#c9773f;--cu2:#e6a06a;--tr:#3a3430}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:grid;grid-template-columns:360px 1fr;background:var(--bg);color:var(--tx);font:14px/1.4 "Segoe UI Variable","Segoe UI",sans-serif}
svg{width:20px;height:20px;fill:currentColor;display:block}
svg .st{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;color:var(--mu);padding:8px;border-radius:50%;display:grid;place-items:center}
button:hover{color:var(--tx)}
button.on{color:var(--cu)}
:focus-visible{outline:2px solid var(--cu);outline-offset:2px}
aside{padding:28px 28px 22px;display:flex;flex-direction:column;gap:18px;background:var(--pn);border-right:1px solid var(--ln)}
#cover{width:100%;aspect-ratio:1;border-radius:8px;background:#221f1c center/cover;display:grid;place-items:center;color:var(--mu)}
#title{font-size:21px;font-weight:600;margin:0;line-height:1.25}
#meta{margin:2px 0 0;color:var(--mu)}
#spec{margin:8px 0 0;display:flex;align-items:center;gap:8px;color:var(--mu);font-size:12px;min-height:20px}
.fmt{font-size:11px;padding:0 6px;border:1px solid var(--tr);border-radius:4px;color:var(--mu);line-height:18px}
.fmt.hi{border-color:var(--cu);color:var(--cu)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:linear-gradient(to right,var(--cu),var(--cu2) var(--p,0%),var(--tr) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;margin-top:-4px;border-radius:50%;background:var(--cu);opacity:0;transition:opacity .15s}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{opacity:1}
.time{display:flex;justify-content:space-between;color:var(--mu);font-size:12px;font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;justify-content:space-between}
#play{color:var(--bg);background:linear-gradient(135deg,var(--cu),var(--cu2));width:46px;height:46px}
#play:hover{filter:brightness(1.15)}
#left{text-align:center;color:var(--mu);font-size:12px;min-height:18px;margin-top:-6px}
.bot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.vol{display:flex;align-items:center;gap:10px;color:var(--mu)}
#out{width:100%;background:transparent;border:0;border-bottom:1px solid var(--ln);padding:4px 0;color:var(--mu);font-size:12px}
#out option{background:var(--pn)}
section{display:flex;flex-direction:column;min-width:0;min-height:0}
header{display:flex;align-items:center;gap:6px;padding:18px 24px 10px}
.tab{border-radius:16px;padding:5px 14px;font-size:14px}
.tab.on{background:var(--ln);color:var(--tx)}
#q{margin-left:auto;width:220px;background:transparent;border:0;border-bottom:1px solid var(--ln);padding:5px 2px}
#pick{border-radius:16px;padding:5px 12px;font-size:13px}
#status{padding:0 24px 8px;color:var(--mu);font-size:12px;min-height:22px}
#list,#lyr{flex:1;overflow:auto;min-height:0}
#list{padding:0 14px 14px}
.row{display:grid;grid-template-columns:30px 1fr 1fr 96px 44px;gap:12px;align-items:center;padding:7px 10px;border-radius:6px;cursor:pointer}
.row:hover{background:var(--pn)}
.row>*{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.n,.al,.d{color:var(--mu);font-variant-numeric:tabular-nums}
.d{text-align:right}
.tt b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.tt i{display:block;font-style:normal;color:var(--mu);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.row.cur .tt b,.row.cur .n{color:var(--cu)}
#lyr{padding:24px 40px 50vh}
.ln{font-size:26px;font-weight:600;line-height:1.35;margin:0 0 16px;color:#5a524b;transition:color .3s}
.ln.on,#lyr.plain .ln{color:var(--tx)}
#lyr.plain .ln{font-size:18px;font-weight:400;margin-bottom:6px}
.empty{color:var(--mu);max-width:380px;margin-top:40px}
@media (max-width:900px){body{grid-template-columns:300px 1fr}.al{display:none}.row{grid-template-columns:30px 1fr 96px 44px}}
#grid{flex:1;overflow:auto;min-height:0;padding:4px 24px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px;align-content:start}
.card{cursor:pointer;min-width:0}
.card b,.card i{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card b{font-weight:500;margin-top:8px}
.card i{font-style:normal;color:var(--mu);font-size:12px}
.cv{aspect-ratio:1;border-radius:6px;background:#221f1c center/cover}
.card:hover .cv{outline:1px solid var(--cu)}
.ah{display:flex;gap:22px;align-items:flex-end;padding:8px 10px 20px}
.ah .cv{width:150px;flex:none}
.ah h2{margin:0;font-size:22px;font-weight:600}
.ah p{margin:2px 0 10px;color:var(--mu)}
.lnk{font-size:12px;padding:2px 10px;border-radius:10px;color:var(--cu);border:1px solid var(--tr)}
.lnk:hover{color:var(--tx);border-color:var(--cu)}
#spec .lnk{margin-left:auto}
#vsel{background:transparent;border:0;border-bottom:1px solid var(--ln);color:var(--mu);padding:4px;margin-left:12px}
#vsel option{background:var(--pn)}
#nx{text-align:center;color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-10px}
#nx b{color:var(--tx);font-weight:500}
.net{font-size:12px;color:var(--mu);display:flex;gap:6px;align-items:center}
.net input{accent-color:var(--cu)}
#queue{flex:1;overflow:auto;min-height:0;padding:0 14px 14px}
.sec{margin:14px 10px 6px;color:var(--mu);font-size:12px}
body.fs{grid-template-columns:46% 1fr}
.fs aside{padding:44px 56px}
.fs #cover{max-width:58vh;margin:0 auto}
.fs #pick,.fs #q,.fs #vsel{display:none}
.fs #title{font-size:28px}
[hidden]{display:none!important}
.stars{display:inline-flex;gap:3px;margin:0 0 12px}
.stars span{font-size:22px;line-height:1;cursor:pointer;color:var(--tr)}
.stars span.on{color:var(--cu)}
.web{display:inline;background:none;border:0;border-radius:0;padding:0 0 0 14px;font-size:12px;color:var(--mu);cursor:pointer}
.web:hover{color:var(--tx);text-decoration:underline}
.rv{padding:0 10px 18px}
#rvt{width:100%;min-height:96px;resize:vertical;background:var(--pn);border:1px solid var(--ln);border-radius:6px;color:var(--tx);padding:10px 12px;font:inherit;line-height:1.5}
#rvt:focus{border-color:var(--cu);outline:0}
.sv{margin:4px 2px 0;color:var(--mu);font-size:12px;min-height:16px}
.card .rt{display:block;color:var(--cu);font-size:12px;letter-spacing:1px}
#status:empty{display:none}
#cover,.ah .cv{cursor:zoom-in}
.sw{margin-left:auto;display:flex;align-items:center}
#q{margin-left:0;width:0;opacity:0;padding:5px 0;transition:width .2s,opacity .2s}
.sw.open #q{width:200px;opacity:1;padding:5px 2px}
#pick{border-radius:50%;padding:8px}
.ic{display:flex;justify-content:space-between}
.stars{align-items:center}
.ibtn{padding:4px;margin-left:6px}
.ibtn.on{color:var(--cu)}
#big{position:fixed;inset:0;z-index:20;background:rgba(10,9,8,.92) center/contain no-repeat;cursor:zoom-out}
#pop{position:fixed;z-index:10;min-width:230px;max-width:320px;background:#1f1c19;border:1px solid var(--ln);border-radius:10px;padding:14px;box-shadow:0 12px 32px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:8px}
#pop p{margin:0}
.ph{font-weight:600}
.mu{color:var(--mu);font-size:12px;word-break:break-all}
.pr{display:flex;gap:8px;flex-wrap:wrap}
.it{display:block;width:100%;text-align:left;border-radius:6px;padding:7px 8px;font-size:13px}
.it:hover{background:var(--ln)}
.it.on{color:var(--cu)}
.swt{width:22px;height:22px;padding:0;border:2px solid transparent}
.swt.on{border-color:var(--tx)}
.fmt.f-flac{border-color:#c9773f;color:#c9773f}
.fmt.f-wav{border-color:#d4b24c;color:#d4b24c}
.fmt.f-mp3{border-color:#7f8fa3;color:#7f8fa3}
.fmt.f-m4a{border-color:#5fa8a0;color:#5fa8a0}
.fmt.f-aac{border-color:#6aa66a;color:#6aa66a}
.fmt.f-ogg{border-color:#9b7fc4;color:#9b7fc4}
.fmt.f-opus{border-color:#c4709b;color:#c4709b}
#pop{max-height:80vh;overflow:auto}
#pop.wide{width:400px;max-width:400px}
#pop select{background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:5px 8px;color:var(--tx)}
#pop select option{background:var(--pn)}
#pop input[type=range]::-webkit-slider-thumb{opacity:1}
.eqb{display:flex;justify-content:space-between;gap:2px}
.bd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--mu)}
.bw{position:relative;width:22px;height:100px}
.bw input{position:absolute;left:50%;top:50%;width:100px;transform:translate(-50%,-50%) rotate(-90deg)}
#cw{position:relative}
#viz{width:100%;aspect-ratio:1;border-radius:8px;display:block;background:#181614}
#vzb{position:absolute;top:10px;right:10px;background:rgba(10,9,8,.6);padding:6px;opacity:0;transition:opacity .15s}
#cw:hover #vzb,#vzb:focus-visible{opacity:1}
.fs #cw{max-width:58vh;margin:0 auto;width:100%}
#bk,#dice{padding:8px}
#sort{background:transparent;border:0;border-bottom:1px solid var(--ln);color:var(--mu);padding:4px;margin-left:8px}
#sort option{background:var(--pn)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:18px 14px;padding:4px 10px 20px}
.why{display:block;color:var(--cu);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.art .cv{border-radius:50%}
.hrb{font-size:11px;padding:0 6px;border-radius:4px;background:linear-gradient(135deg,#b8892b,#f4d479);color:#1a1408;font-weight:600;line-height:18px;margin-left:6px}
.ly-hc .ln{color:#a39a90}
.ly-hc .ln.on,.ly-hc #lyr.plain .ln{color:#fff;text-shadow:0 0 22px rgba(255,255,255,.28)}
.ly-ac .ln.on{color:var(--cu)}
.ly-l .ln{font-size:32px}
.ly-xl .ln{font-size:40px}
.ly-l #lyr.plain .ln{font-size:22px}
.ly-xl #lyr.plain .ln{font-size:26px}
#cinx{display:none;position:fixed;top:18px;right:22px;z-index:15;background:rgba(10,9,8,.6)}
.cin #cinx{display:grid}
body.cin{grid-template-columns:1fr}
.cin section,.cin .bot{display:none}
.cin aside{padding:3vh 5vw;gap:1.4vh;background:#0b0a09;border:0;height:100vh;text-align:center}
.cin #cw{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.cin #cover{height:100%;width:auto;max-width:100%}
.cin #viz{width:100%;height:100%;aspect-ratio:auto;border-radius:0}
.cin #title{font-size:3.4vh}
.cin #spec{justify-content:center}
.cin aside>*:not(#cw):not(:nth-child(2)),.cin #cinx{transition:opacity .5s}
.cin.idle{cursor:none}
.cin.idle aside>*:not(#cw):not(:nth-child(2)),.cin.idle #cinx{opacity:0}
#cfm{position:fixed;inset:0;z-index:30;background:rgba(8,7,6,.7);display:grid;place-items:center}
.cbox{background:#1f1c19;border:1px solid var(--ln);border-radius:12px;padding:22px 24px;width:min(440px,90vw);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 16px 40px rgba(0,0,0,.55)}
.cbox h3{margin:0;font-size:17px}
.cbox p{margin:0;color:var(--mu)}
.cbox input,.cbox select{background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:7px 9px;color:var(--tx)}
.cbox input:focus{border-color:var(--cu);outline:0}
.cbox .fr{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.cbox label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:4px}
.cbtn{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.cbtn button{border-radius:8px;padding:8px 16px;border:1px solid var(--ln);color:var(--tx)}
.cbtn button.ok{background:linear-gradient(135deg,var(--cu),var(--cu2));border-color:transparent;color:var(--bg)}
.cbtn button.danger{background:#b3402e;border-color:transparent;color:#fff}
#ctx{position:fixed;z-index:25;min-width:210px;background:#1f1c19;border:1px solid var(--ln);border-radius:10px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.5)}
#ctx button{display:block;width:100%;text-align:left;border-radius:6px;padding:7px 10px;font-size:13px;color:var(--tx)}
#ctx button:hover{background:var(--ln)}
#ctx button.danger{color:#e07b6a}
#ctx hr{border:0;border-top:1px solid var(--ln);margin:5px 0}
#ctx .sub{color:var(--mu);font-size:11px;padding:4px 10px;margin:0}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:40;background:#1f1c19;border:1px solid var(--ln);border-radius:20px;padding:8px 18px;font-size:13px}
#rank{padding:8px}
#rank.on{color:var(--cu)}
.tier{grid-column:1/-1;display:flex;align-items:stretch;border:1px solid var(--ln);border-radius:10px;min-height:96px;overflow:hidden}
.tier.over{border-color:var(--cu)}
.tl{width:54px;flex:none;display:grid;place-items:center;font-size:22px;font-weight:700;color:var(--bg)}
.tc{display:flex;flex-wrap:wrap;gap:10px;padding:10px;flex:1;align-content:flex-start}
.tc .card{width:92px}
.tc .card b{font-size:11px}
.card.new{border:1px dashed var(--tr);border-radius:8px;display:grid;place-items:center;aspect-ratio:1;color:var(--mu);text-align:center;padding:10px}
.card.new:hover{border-color:var(--cu);color:var(--tx)}
#cinbar{display:none}
.cin #cinbar{display:flex;justify-content:center;align-items:center;gap:14px;color:var(--mu)}
#cvl{width:200px}
#clyr{display:none;text-align:left;overflow:hidden;padding:30vh 0}
.cin.cly1 #clyr,.cin.cly2 #clyr{display:block;flex:1;min-width:0;height:100%;-webkit-mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent)}
.cin.cly1 #cover,.cin.cly1 #viz{flex:none;width:42%;height:auto;aspect-ratio:1;max-height:100%}
.cin.cly2 #cover,.cin.cly2 #viz,.cin.cly2 #vzb{display:none}
.cin.cly2 #clyr{text-align:center}
.cin #cw{gap:4vw}
#clyr .ln{font-size:3.6vh;margin:0 0 2.4vh}
#clyr.plain .ln{font-size:2.6vh;font-weight:400;color:var(--tx)}
#an{position:fixed;inset:0;z-index:30;background:rgba(8,7,6,.82);display:grid;place-items:center}
.abox{background:#1f1c19;border:1px solid var(--ln);border-radius:12px;padding:18px 20px;width:min(1040px,94vw);max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.ahd{display:flex;justify-content:space-between;align-items:center}
.ahd h3{margin:0;font-size:16px}
#anc{width:100%;height:auto;border-radius:6px;background:#000}
#anr{color:var(--mu);font-size:13px;line-height:1.7}
#anr b{color:var(--tx)}
.playb{width:40px;height:40px;padding:0;border-radius:50%;background:linear-gradient(135deg,var(--cu),var(--cu2));color:var(--bg);display:grid;place-items:center}
.playb:hover{filter:brightness(1.15);color:var(--bg)}
.acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#vnb{position:absolute;top:10px;right:48px;background:rgba(10,9,8,.6);padding:6px;opacity:0;transition:opacity .15s}
#cw:hover #vnb,#vnb:focus-visible{opacity:1}
.cin aside{display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:minmax(0,1fr) auto auto auto;gap:1.2vh 2vw;align-items:center;text-align:left}
.cin #cw{grid-column:1/-1;align-self:stretch;min-height:0}
.cin aside>:nth-child(2){grid-row:3;grid-column:1;min-width:0}
.cin aside>:nth-child(3){grid-row:2;grid-column:1/-1}
.cin .ctl{grid-row:3;grid-column:2;justify-content:center;gap:2.4vw}
.cin #cinbar{grid-row:3;grid-column:3;justify-self:end}
.cin #left,.cin #nx{grid-row:4;grid-column:1/-1;text-align:center;margin:0}
.cin #spec{justify-content:flex-start}
.cin #spec .ibtn{margin-left:8px!important}
.cin #title{font-size:2.8vh}
</style>
</head>
<body>

<symbol id="i-gear" viewBox="0 0 24 24"><circle class="st" cx="12" cy="12" r="3"/><path class="st" d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></symbol>
<symbol id="i-note" viewBox="0 0 24 24"><path class="st" d="M4 20l4-1 11-11-3-3L5 16zM14 7l3 3"/></symbol>
<symbol id="i-fx" viewBox="0 0 24 24"><path class="st" d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2.2"/><circle cx="15" cy="12" r="2.2"/><circle cx="8" cy="17" r="2.2"/></symbol>
<symbol id="i-viz" viewBox="0 0 24 24"><path class="st" d="M3 12h3l2-6 4 12 3-9 2 3h4"/></symbol>
<symbol id="i-globe" viewBox="0 0 24 24"><circle class="st" cx="12" cy="12" r="8.5"/><path class="st" d="M3.5 12h17M12 3.5c2.6 2.4 4 5.4 4 8.5s-1.4 6.1-4 8.5c-2.6-2.4-4-5.4-4-8.5s1.4-6.1 4-8.5z"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path class="st" d="M19 12H6M11 6l-6 6 6 6"/></symbol>
<symbol id="i-dice" viewBox="0 0 24 24"><rect class="st" x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.3"/><circle cx="15" cy="9" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="9" cy="15" r="1.3"/><circle cx="15" cy="15" r="1.3"/></symbol>
<symbol id="i-power" viewBox="0 0 24 24"><path class="st" d="M12 3v8M7 6.5a7 7 0 1 0 10 0"/></symbol>
