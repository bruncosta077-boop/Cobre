<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Conta Cobre</title>
<style>
  :root{--bg:#121110;--panel:#181614;--line:#2a2623;--tx:#ece6df;--mu:#8d847b;--cu:#c9773f;--ok:#5fb37a;--bad:#d1604f}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,Segoe UI,sans-serif;padding:24px}
  h1{font-size:20px;margin:0 0 4px} .mu{color:var(--mu)} .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:16px}
  label{display:block;margin:12px 0 4px;color:var(--mu);font-size:12px}
  input{width:100%;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--tx);font-size:14px}
  input:focus{outline:1px solid var(--cu)}
  button{padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--tx);cursor:pointer;font-size:14px}
  button.pri{background:var(--cu);border-color:var(--cu);color:#1a1209;font-weight:600} button:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:8px;margin-top:16px} .row>button{flex:1}
  .err{color:var(--bad);margin-top:12px;min-height:18px}
  .dev{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)} .dev:first-child{border-top:0}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--mu);flex:none} .dot.on{background:var(--ok)}
  .dev .n{flex:1;min-width:0} .dev .n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .small{font-size:12px} .hide{display:none}
</style></head><body>
<h1>Conta Cobre</h1>
<div class="mu">Uma conta para o computador, o celular e a TV.</div>

<div id="out" class="card hide">
  <label>Email</label><input id="email" type="email" autocomplete="username">
  <label>Senha (mínimo 8 caracteres)</label><input id="pw" type="password" autocomplete="current-password">
  <details id="adv" style="margin-top:12px"><summary class="mu small" style="cursor:pointer">Avançado: servidor do Cobre</summary>
    <input id="srv" placeholder="http://192.168.0.10:8080" style="margin-top:8px"></details>
  <div class="err" id="err"></div>
  <div class="row"><button class="pri" id="bin">Entrar</button><button id="bnew">Criar conta</button></div>
  <div class="row" style="margin-top:8px"><button id="blater">Agora não</button><button id="bnever" class="small mu">Não perguntar mais</button></div>
  <div class="small mu" style="margin-top:12px">Sem conta, o Cobre continua funcionando normalmente no computador.</div>
</div>

<div id="in" class="card hide">
  <div><b id="me"></b></div>
  <div class="small mu" id="srvTxt"></div>
  <div class="small" id="link" style="margin-top:8px"></div>
</div>
<div id="devs" class="card hide"><b>Seus dispositivos</b><div id="list" style="margin-top:6px"></div>
  <div class="err" id="err2"></div></div>
<div class="row hide" id="outRow"><button id="bout">Sair desta conta</button></div>

<script>
const $ = (id) => document.getElementById(id);
const api = window.cobreAccount;
const TYPES = { desktop: 'Computador', mobile: 'Celular', tv: 'TV' };
let timer = null;

function ago(ts) {
  if (!ts) return 'nunca conectou';
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 60) return 'há instantes'; if (s < 3600) return 'há ' + Math.round(s / 60) + ' min';
  if (s < 86400) return 'há ' + Math.round(s / 3600) + ' h'; return 'há ' + Math.round(s / 86400) + ' dias';
}
function setLink(l) { const e = $('link'); e.textContent = l.text; e.style.color = l.ok ? 'var(--ok)' : 'var(--mu)'; }

async function drawDevices() {
  const r = await api.devices();
  if (!r.ok) { if (r.code === 'signed_out' || r.code === 'device_revoked') return render(); $('err2').textContent = r.error; return; }
  $('err2').textContent = '';
  const box = $('list'); box.textContent = '';
  for (const d of r.data) {
    const row = document.createElement('div'); row.className = 'dev';
    const dot = document.createElement('span'); dot.className = 'dot' + (d.online ? ' on' : '');
    const n = document.createElement('div'); n.className = 'n';
    const b = document.createElement('b'); b.textContent = d.name + (d.current ? ' (este)' : '');
    const s = document.createElement('span'); s.className = 'small mu';
    s.textContent = (TYPES[d.type] || d.type) + ' · ' + (d.online ? 'online' : 'offline, visto ' + ago(d.lastSeen));
    n.append(b, s); row.append(dot, n);
    if (!d.current) {
      const x = document.createElement('button'); x.textContent = 'Remover';
      x.onclick = async () => { if (confirm('Remover "' + d.name + '" da conta?')) { await api.remove(d.id); drawDevices(); } };
      row.append(x);
    }
    box.append(row);
  }
}

async function render() {
  clearInterval(timer);
  const r = await api.status(); const s = r.data;
  const logged = r.ok && s.loggedIn;
  for (const id of ['out']) $(id).classList.toggle('hide', logged);
  for (const id of ['in', 'devs', 'outRow']) $(id).classList.toggle('hide', !logged);
  if (!logged) {
    if (r.ok) { $('email').value = s.email || ''; $('srv').value = s.server || s.defaultServer || 'http://localhost:8080'; }
    return;
  }
  $('me').textContent = s.email; $('srvTxt').textContent = s.server; setLink(s.link || { ok: false, text: '' });
  drawDevices(); timer = setInterval(drawDevices, 10000);
}

async function go(create) {
  $('err').textContent = ''; $('bin').disabled = $('bnew').disabled = true;
  const r = await api.login({ server: $('srv').value, email: $('email').value, password: $('pw').value, create });
  $('bin').disabled = $('bnew').disabled = false;
  if (!r.ok) {
    $('err').textContent = r.error + (r.code === 'network' ? ' Confira se o "Iniciar Cobre ID" está aberto e o endereço em "Avançado".' : '');
    if (r.code === 'network' || r.code === 'no_server' || r.code === 'bad_server') $('adv').open = true;
    return;
  }
  $('pw').value = '';
  // Logou: confirma rapidinho e fecha. A conexão continua em segundo plano.
  document.body.innerHTML = '<h1>Pronto!</h1><div class="mu" style="margin-top:8px">Você está conectado ao Cobre. Pode usar o app normalmente; este computador já aparece no seu celular.</div>';
  setTimeout(() => api.close(), 1800);
}
$('bin').onclick = () => go(false); $('bnew').onclick = () => go(true);
$('blater').onclick = () => api.close(); $('bnever').onclick = () => api.never();
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(false); });
$('bout').onclick = async () => { if (confirm('Sair desta conta neste computador?')) { await api.logout(); render(); } };
api.onLink(setLink);
render();
</script></body></html>
