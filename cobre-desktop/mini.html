<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Cobre</title>
<style>
:root{--bg:#181614;--ln:#2a2623;--tx:#ece6df;--mu:#8d847b;--cu:#c9773f;--cu2:#e6a06a}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:13px/1.35 "Segoe UI",sans-serif;padding:10px;border:1px solid var(--ln);display:flex;flex-direction:column;gap:7px;-webkit-app-region:drag;overflow:hidden;user-select:none}
.cw{position:relative}
#c{width:100%;aspect-ratio:1;border-radius:10px;background:#221f1c center/cover}
.tl{position:absolute;top:8px;right:8px;display:flex;gap:6px;-webkit-app-region:no-drag}
.tl button{width:24px;height:24px;background:rgba(10,9,8,.62);color:var(--tx)}
b,i{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:normal;text-align:center}
b{font-size:12px}
i{color:var(--mu);font-size:11px}
#p{height:2px;background:var(--ln);border-radius:2px;overflow:hidden}
#p div{height:100%;width:0;background:linear-gradient(90deg,var(--cu),var(--cu2))}
.k{display:flex;align-items:center;justify-content:center;gap:12px;height:40px;-webkit-app-region:no-drag}
button{background:none;border:0;padding:0;color:var(--mu);cursor:pointer;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;outline:none;flex:none}
button:hover{color:var(--tx)}
button:focus,button:active{outline:none;background:none}
.tl button:hover{background:rgba(10,9,8,.85)}
#t{background:linear-gradient(135deg,var(--cu),var(--cu2));color:#181614;width:38px;height:38px}
#t:hover{filter:brightness(1.12);color:#181614}
svg{width:18px;height:18px;fill:currentColor;display:block}
svg.st{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style></head>
<body>
<div class="cw"><div id="c"></div><div class="tl"><button id="op" aria-label="Abrir o Cobre" title="Abrir o Cobre (fecha o mini player)"><svg class="st" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button><button id="x" aria-label="Fechar" title="Fechar"><svg class="st" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>
<div><b id="ti">Nada tocando</b><i id="ar"></i></div>
<div id="p"><div></div></div>
<div class="k"><button id="pv" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg></button><button id="t" aria-label="Tocar ou pausar"></button><button id="nx" aria-label="Próxima"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg></button></div>
<script>
const $ = (s) => document.querySelector(s);
const PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>', PAUSE = '<svg viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>';
$('#t').innerHTML = PLAY;
mini.onState((s) => {
  $('#ti').textContent = s.title; $('#ar').textContent = s.artist;
  $('#c').style.backgroundImage = s.cover ? `url("${s.cover}")` : '';
  $('#t').innerHTML = s.playing ? PAUSE : PLAY;
  $('#p div').style.width = (s.dur ? s.pos / s.dur * 100 : 0) + '%';
  if (s.acc) { document.documentElement.style.setProperty('--cu', s.acc); document.documentElement.style.setProperty('--cu2', s.acc2 || s.acc); }
});
$('#pv').onclick = () => mini.cmd('prev'); $('#t').onclick = () => mini.cmd('toggle'); $('#nx').onclick = () => mini.cmd('next');
$('#op').onclick = () => mini.show(); $('#x').onclick = () => mini.close();
</script></body></html>
